<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>CineAI | Movie Recommender System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.63.1/build/stlite.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0e1117;
      }
      #loader {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #0e1117;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        color: #fff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        transition: opacity 0.5s ease;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top-color: #FF416C;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="spinner"></div>
      <h2 style="margin:0; font-weight: 600; background: linear-gradient(135deg, #FF416C 0%, #8A2387 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">CineAI Recommender</h2>
      <p style="color: #A0AEC0; font-size: 0.95rem; margin-top: 10px;">Loading AI Engine & Movie Matrices in WebAssembly...</p>
    </div>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.63.1/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          requirements: ["numpy", "pandas", "requests", "scikit-learn"],
          entrypoint: "app.py",
          files: {
            "app.py": {
              url: "https://raw.githubusercontent.com/12ATHARAV/Movie-Recommendor-System/main/app.py"
            },
            "movies.pickle": {
              url: "https://raw.githubusercontent.com/12ATHARAV/Movie-Recommendor-System/main/movies.pickle"
            },
            "similarity.pickle": {
              url: "https://raw.githubusercontent.com/12ATHARAV/Movie-Recommendor-System/main/similarity.pickle"
            }
          }
        },
        document.getElementById("root")
      );
      // Hide loader once Streamlit is mounted
      setTimeout(() => {
        const loader = document.getElementById("loader");
        if (loader) {
          loader.style.opacity = "0";
          setTimeout(() => loader.remove(), 500);
        }
      }, 4000);
    </script>
  </body>
</html>
